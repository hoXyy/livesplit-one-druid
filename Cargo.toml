[package]
name = "livesplit-one"
version = "0.7.2"
authors = ["Christopher Serr <christopher.serr@gmail.com>"]
edition = "2021"
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
relm4 = { version = "0.11", features = ["libadwaita"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gdk4-x11 = "0.11"
x11rb = "0.13"
glib = "0.22"
gio = "0.22"
livesplit-core = { git = "https://github.com/hoXyy/livesplit-core", branch = "dev", features = ["font-loading", "software-rendering", "image", "image-shrinking", "more-image-formats"] }
image = "0.25.5"
log = { version = "0.4.22", features = ["serde"] }
serde = { version = "1.0.215", features = ["derive", "rc"] }
serde_yaml = "0.9.34"
serde_json = "1.0.133"
fern = "0.7.0"
chrono = { version = "0.4.38", features = ["serde", "clock"], default-features = false }
directories = "5.0.1"
backtrace = "0.3.74"
mimalloc = { version = "0.1.43", default-features = false }
once_cell = "1.20.2"
anyhow = "1.0.93"
fontdb = "0.16.2"
clap = { version = "4.5.20", features = ["derive"] }
ureq = "2.12.1"
roxmltree = "0.20.0"
pulldown-cmark = { version = "0.13.0", default-features = false }
nix = { version = "0.31.3", features = ["user"] }

[build-dependencies]
glib-build-tools = "0.22"

[features]
default = ["auto-splitting"]
auto-splitting = ["livesplit-core/auto-splitting"]

[profile.max-opt]
inherits = "release"
lto = true
panic = "abort"
codegen-units = 1

[profile.max-opt.build-override]
opt-level = 0
